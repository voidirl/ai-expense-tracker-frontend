server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Trailing slash is required: it makes nginx strip the /ai-api prefix, so
    # /ai-api/chat is forwarded as /chat. Without it the service would 404.
    location /ai-api {
        # A trailing slash on proxy_pass would rewrite /ai-api/chat into
        # //chat, and FastAPI does not collapse the double slash, so it 404s.
        # Rewriting explicitly is the only form that yields a clean /chat.
        rewrite ^/ai-api/?(.*)$ /$1 break;
        proxy_pass http://ai-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
